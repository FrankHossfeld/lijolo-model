name: Build & Deploy

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "README.md"
jobs:
  build-jdk21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile with Maven
        run: mvn compile -ntp

  test-jdk21:
    runs-on: ubuntu-latest
    needs: [ build-jdk21 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test with Maven
        run: mvn test -ntp
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-report
          path: target/surefire-reports/

  owasp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      security-events: write
    needs: [ build-jdk21 ]
    services:
      owasp-db:
        image: nalusolutionsgmbh/owasp-maven-action:latest
        options: --entrypoint /bin/sh --name owasp-db --hostname owasp-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Copy owasp database from container to runner
        run: docker cp $(docker ps -aqf "name=owasp-db"):/dependency-check/data ./dependency-checker-db/
      - name: OWASP Check
        run: |
          mvn org.owasp:dependency-check-maven:12.1.6:aggregate \
          -DdataDirectory=./dependency-checker-db \
          -DfailBuildOnCVSS=7 \
          -Dodc.outputDirectory=reports \
          -Dformat=HTML \
          -DautoUpdate=false \
          -DsuppressionFiles=./owasp/owasp-suppressions.xml
      - name: Upload OWASP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OWASP report
          path: ${{github.workspace}}/**/reports/dependency-check-report.html
